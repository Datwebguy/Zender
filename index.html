<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Zero to a shielded Zcash send in six steps, with a guide video on each.">
  <meta property="og:title" content="Zender">
  <meta property="og:description" content="Send yourself a sealed Zcash note in six steps.">
  <meta property="og:image" content="https://tryzender.vercel.app/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>Zender</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="bar">
        <span class="wordmark">Zender</span>
        <a class="close" href="/1" data-nav aria-label="Close, back to step 1">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
        </a>
      </div>
      <ol class="ticks" id="ticks" aria-label="Progress">
        <li></li><li></li><li></li><li></li><li></li><li></li>
      </ol>
    </header>

    <main id="main" tabindex="-1">
      <p class="sr-only" id="count">Step 1 of 6</p>
      <h1 id="title">Install Zodl</h1>
      <p class="sentence" id="sentence">Install the wallet, then switch it to testnet.</p>

      <div class="stage" id="stage">
        <div class="sealed" id="sealed" hidden>
          <div class="panel mine">
            <p class="plabel">You see</p>
            <p class="pnote" id="mynote">Your note</p>
          </div>
          <div class="panel theirs">
            <p class="plabel">Everyone else sees</p>
            <p class="prow"><span>Sender</span><b>hidden</b></p>
            <p class="prow"><span>Amount</span><b>hidden</b></p>
            <p class="prow"><span>Note</span><b>sealed</b></p>
          </div>
        </div>
        <div class="media" id="media">
          <video id="video" muted playsinline autoplay preload="auto"></video>
          <div class="coming" id="coming" hidden>
            <span class="tag">Video coming</span>
            <p id="coming-text"></p>
          </div>
          <div class="qr" id="qr" hidden></div>
          <div class="linkview" id="linkview" hidden><code id="uri"></code></div>
          <button type="button" class="chip replay" id="replay" hidden>Replay</button>
        </div>
      </div>

      <div class="extras" id="extras"></div>
    </main>

    <nav class="actions" aria-label="Step navigation">
      <a class="back" id="back" href="/1" data-nav>Back</a>
      <a class="next" id="next" href="/2" data-nav>Next</a>
    </nav>

    <footer class="foot">
      <p>Testnet only · ZECATHON</p>
    </footer>
  </div>
  <noscript><p class="noscript">Turn on JavaScript in your browser to use Zender.</p></noscript>
</body>
</html>
