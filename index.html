<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Zero to a shielded Zcash testnet send in six steps, with a guide video on each.">
  <title>Zender</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="bar">
        <span class="wordmark">Zender</span>
        <a class="close" href="/1" data-nav aria-label="Close, back to step 1">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
        </a>
      </div>
      <ol class="ticks" id="ticks" aria-label="Progress">
        <li></li><li></li><li></li><li></li><li></li><li></li>
      </ol>
    </header>

    <main id="main" tabindex="-1">
      <p class="count" id="count">Step 1 of 6</p>
      <h1 id="title">Install Zodl</h1>
      <p class="sentence" id="sentence">Install the wallet, then switch it to testnet.</p>

      <div class="media" id="media">
        <video id="video" muted playsinline autoplay controls preload="metadata"></video>
        <button type="button" class="replay" id="replay" hidden>Replay</button>
        <div class="coming" id="coming" hidden>
          <span class="tag">Video coming</span>
          <p id="coming-text"></p>
        </div>
      </div>

      <div class="extras" id="extras"></div>
    </main>

    <nav class="actions" aria-label="Step navigation">
      <a class="back" id="back" href="/1" data-nav>Back</a>
      <a class="next" id="next" href="/2" data-nav>Next</a>
    </nav>

    <footer class="foot">
      <p>Testnet only. No account. Notes stay in Zodl.</p>
      <p class="event">ZECATHON</p>
    </footer>
  </div>
  <noscript><p class="noscript">Turn on JavaScript in your browser to use Zender.</p></noscript>
</body>
</html>
